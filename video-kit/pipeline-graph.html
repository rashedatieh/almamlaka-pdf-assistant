    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const l1 = Math.hypot(x1-x0, y1-y0), l2 = Math.hypot(x2-x1, y2-y1), rr = Math.min(r, l1/2, l2/2);
    const ax = x1 - (x1-x0)/l1*rr, ay = y1 - (y1-y0)/l1*rr, bx = x1 + (x2-x1)/l2*rr, by = y1 + (y2-y1)/l2*rr;
    d += ` L${ax},${ay} Q${x1},${y1} ${bx},${by}`;
  }
  const last = pts[pts.length-1]; return d + ` L${last[0]},${last[1]}`;
}

function draw(){
  svg.innerHTML = "";
  svg.setAttribute("aria-label", UI[S.lang].graph);
  const defs = el("defs", {}, svg);
  const marks = { main:"#2c3a4d", branch:"#d8901a", data:"#6c7a8f", off:"#9aa1ad", active:"#9e0b0f", hover:"#f5a623" };
  for (const k in marks){
    const m = el("marker", { id:"m-"+k, viewBox:"0 0 10 10", refX:"9", refY:"5", markerWidth:"9", markerHeight:"9", markerUnits:"userSpaceOnUse", orient:"auto" }, defs);
    el("path", { d:"M0,0 L10,5 L0,10 z", fill:marks[k] }, m);
  }
  // lanes
  const lanes = [[6,146],[166,552],[730,144]];
  lanes.forEach(([y,h], i) => {
    el("rect", { x:6, y, width:W-12, height:h, rx:10, class:"lane" + (i===1?" lane-on":"") }, svg);
    // with direction=rtl, "start" is the right edge, so the label grows inward from the mirrored corner
    txt(svg, X(22), y+18, UI[S.lang].lanes[i], "lane-label", "start").setAttribute("direction", rtl() ? "rtl" : "ltr");
  });
  // edges
  for (const e of EDGES){
    const pts = e.pts.map(([x,y]) => [X(x), y]);
    const g = el("g", { class:`edge e-${e.kind}`, id:"e-"+e.id, tabindex:"0", role:"button" }, svg);
    const label = e.lbl ? e.lbl[S.lang] : "";
    g.setAttribute("aria-label", `${UI[S.lang].arrow}: ${byId[e.from].t[S.lang]} → ${byId[e.to].t[S.lang]}${label ? ". " + label : ""}`);
    const d = roundPath(pts, 10);
    el("path", { d, class:"hit" }, g);
    const ln = el("path", { d, class:"ln", "marker-end":`url(#m-${e.kind})` }, g);
    ln.dataset.kind = e.kind;
    if (e.lbl){
      const [lx, ly, la] = e.lp;
      const bg = el("rect", { class:"lbl-bg", rx:4 }, g);
      const t = txt(g, X(lx), ly, label, "lbl", anchorFor(la, label));
      const b = t.getBBox(); bg.setAttribute("x", b.x-4); bg.setAttribute("y", b.y-1); bg.setAttribute("width", b.width+8); bg.setAttribute("height", b.height+2);
    }
    g.addEventListener("click", () => openEdge(e.id));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openEdge(e.id); } });
  }
  // nodes
  for (const n of NODES){
    const x0 = X(n.cx) - n.w/2, y0 = n.cy - n.h/2;
    const g = el("g", { class:`node k-${n.kind}`, id:"n-"+n.id, tabindex:"0", role:"button" }, svg);
    const subs = n.s[S.lang].filter(Boolean);
    g.setAttribute("aria-label", `${n.t[S.lang]}. ${subs.join(". ")}`);
    el("rect", { x:x0-5, y:y0-5, width:n.w+10, height:n.h+10, rx:13, class:"ring" }, g);
    el("rect", { x:x0, y:y0, width:n.w, height:n.h, rx:9, class:"box" }, g);
    const lines = n.s[S.lang];
    const pillH = n.pill ? 22 : 0, titleH = 20, subH = 16;
    const total = pillH + titleH + lines.length * subH;
    let y = n.cy - total/2;
    if (n.pill){
      const pr = el("rect", { class:"pill-r", rx:9, height:17, y:y }, g);
      const pt = txt(g, X(n.cx), y+12.5, n.pill[S.lang], "pill-t");
      const w = pt.getComputedTextLength() + 16; pr.setAttribute("width", w); pr.setAttribute("x", X(n.cx) - w/2);
      y += pillH;
    }
    txt(g, X(n.cx), y+15, n.t[S.lang], "t"); y += titleH;
    for (const s of lines){ if (s) txt(g, X(n.cx), y+13, s, "s"); y += subH; }
    g.addEventListener("click", () => openNode(n.id));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openNode(n.id); } });
  }
  // legend
  if (S.legend) drawLegend();
  applyState();
}

function drawLegend(){
  const L = UI[S.lang].legend, bx = 1020, by = 752, bw = 372, bh = 116;
  const g = el("g", { id:"legend", "aria-hidden":"true" }, svg);
  el("rect", { x: rtl() ? W - bx - bw : bx, y:by, width:bw, height:bh, rx:8, class:"legend-box" }, g);
  const col = (cx) => rtl() ? W - cx : cx;
  const a = "start"; // direction is set per language, so "start" mirrors by itself
  txt(g, col(bx+12), by+17, L.nodes, "lg-h", a).setAttribute("direction", rtl() ? "rtl" : "ltr");
  txt(g, col(bx+200), by+17, L.edges, "lg-h", a).setAttribute("direction", rtl() ? "rtl" : "ltr");
  const nodes = [["claude","#fff","#9e0b0f",""],["code","#fff","#1b2430",""],["offline","#e9edf3","#2c3a4d",""],["branch","#fff3dc","#d8901a","5 3"],["off","#f1f2f4","#9aa1ad","4 3"],["ui","#1b2430","#1b2430",""]];
  nodes.forEach(([k, fill, stroke, dash], i) => {
    const y = by + 28 + i*14.3;
    el("rect", { x: col(bx+12) - (rtl()?18:0), y: y-1, width:18, height:11, rx:2.5, fill, stroke, "stroke-width":1.4, "stroke-dasharray":dash }, g);
    const t = txt(g, col(bx+36), y+8.5, L[k], "lg-t", a); t.setAttribute("direction", rtl() ? "rtl" : "ltr");
  });
  const edges = [["main","#2c3a4d",""],["branch_e","#d8901a","7 5"],["data","#6c7a8f",""],["off_e","#9aa1ad","3 5"],["active","#9e0b0f",""]];
  edges.forEach(([k, stroke, dash], i) => {
    const y = by + 33 + i*16;
    const x1 = col(bx+200), x2 = col(bx+232);
    el("line", { x1, y1:y, x2, y2:y, stroke, "stroke-width": k==="active"?3:2, "stroke-dasharray":dash }, g);
    const t = txt(g, col(bx+240), y+4, L[k], "lg-t", a); t.setAttribute("direction", rtl() ? "rtl" : "ltr");
  });
}

/* ---------- panel ---------- */
function kindLabel(k){ const K = UI[S.lang].kinds; return { claude:K.claude, code:K.code, offline:K.offline, branch:K.branch, off:K.off, ui:K.ui, side:K.side }[k]; }
function kindClass(k){ return k === "claude" ? "claude" : k === "branch" ? "branch" : k === "off" ? "off" : ""; }
function showPanel(){ const p = $("panel"); p.hidden = false; p.setAttribute("dir", rtl() ? "rtl" : "ltr"); }
function openNode(id, opts){
  stopTimer(); if (S.playing && !S.paused) setPaused(true);
  const n = byId[id], c = P[id][S.lang], h = UI[S.lang].h;
  S.lastFocus = document.activeElement; S.panel = { type:"node", id };
  if (!opts || !opts.keepReq) S.fromReq = !!S.req;
  $("p-kind").innerHTML = esc(kindLabel(n.kind)) + (n.pill ? ` · <bdi>${esc(n.pill[S.lang])}</bdi>` : "");
  $("p-kind").className = "p-kind " + kindClass(n.kind);
  $("p-title").textContent = n.t[S.lang];
  $("p-sub").textContent = c.sub;
  const refs = (c.refs || []).map(r => `<span class="ref">${r}</span>`).join("");
  $("p-body").innerHTML =
    (S.fromReq ? `<button class="back" type="button" id="p-back">${UI[S.lang].back}</button>` : "") +
    `<h3>${h.what}</h3>${c.what}<h3>${h.why}</h3>${c.why}<div class="refs">${refs}</div>` +
    `<h3>${h.io}</h3>${c.io}<h3>${h.fail}</h3>${c.fail}<h3>${h.cost}</h3>${c.cost}` +
    `<h3>${h.files}</h3><ul class="files">${P[id].files.map(f => `<li><code>${f}</code></li>`).join("")}</ul>`;
  const back = $("p-back"); if (back) back.addEventListener("click", () => openReqs(true));
  showPanel(); markSelected("n-"+id); $("p-title").focus({ preventScroll:true }); $("panel").scrollTop = 0;
}
function openEdge(id){
  stopTimer(); if (S.playing && !S.paused) setPaused(true);
  const e = EDGES.find(x => x.id === id), h = UI[S.lang].h;
  S.lastFocus = document.activeElement; S.panel = { type:"edge", id }; S.fromReq = false;
  $("p-kind").textContent = UI[S.lang].kinds.edge; $("p-kind").className = "p-kind";
  $("p-title").textContent = `${byId[e.from].t[S.lang]} → ${byId[e.to].t[S.lang]}`;
  $("p-sub").textContent = e.lbl ? e.lbl[S.lang] : "";
  $("p-body").innerHTML = `<h3>${h.edge}</h3>${ED[id][S.lang]}` +
    `<div class="chips"><button class="chip" type="button" data-n="${e.from}">${h.from}: ${byId[e.from].t[S.lang]}</button><button class="chip" type="button" data-n="${e.to}">${h.to}: ${byId[e.to].t[S.lang]}</button></div>`;
  $("p-body").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => openNode(b.dataset.n)));
  showPanel(); markSelected("e-"+id); $("p-title").focus({ preventScroll:true }); $("panel").scrollTop = 0;
}
function openReqs(keepSel){
  stopTimer(); if (S.playing && !S.paused) setPaused(true);
  const U = UI[S.lang];
  S.panel = { type:"req" }; S.fromReq = false;
  $("p-kind").textContent = "9 / 9"; $("p-kind").className = "p-kind branch";
  $("p-title").textContent = U.reqTitle; $("p-sub").textContent = "";
  const items = REQS.map((r, i) => {
    const on = S.req === i;
    const detail = on ? `<div class="req-detail"><b>${U.how}.</b> ${r.h[S.lang]}<div class="refs">${r.refs.map(x => `<span class="ref">${x}</span>`).join("")}</div><div class="chips">${r.n.map(id => `<span class="chip" role="button" tabindex="0" data-n="${id}">${byId[id].t[S.lang]}</span>`).join("")}</div></div>` : "";
    return `<li><button class="req-btn" type="button" data-i="${i}" aria-pressed="${on}"><span class="num">${i+1}</span><span>${r.t[S.lang]}</span></button>${detail}</li>`;
  }).join("");
  $("p-body").innerHTML = `<p>${U.reqIntro}</p><ul class="req-list">${items}</ul>`;
  $("p-body").querySelectorAll(".req-btn").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i; S.req = S.req === i ? null : i; openReqs(true); const nb = $("p-body").querySelector(`.req-btn[data-i="${i}"]`); if (nb) nb.focus(); }));
  $("p-body").querySelectorAll(".chip").forEach(c => { const go = () => { S.fromReq = true; openNode(c.dataset.n, { keepReq:true }); }; c.addEventListener("click", go); c.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }); });
  $("b-req").setAttribute("aria-pressed", "true");
  showPanel(); applyState(); if (!keepSel) $("p-title").focus({ preventScroll:true });
}
function closePanel(){
  const wasReq = S.panel && S.panel.type === "req";
  $("panel").hidden = true; S.panel = null; markSelected(null);
  if (wasReq || S.fromReq){ S.req = null; S.fromReq = false; $("b-req").setAttribute("aria-pressed", "false"); applyState(); }
  if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus({ preventScroll:true });
}
function markSelected(domId){ svg.querySelectorAll(".selected").forEach(x => x.classList.remove("selected")); if (domId){ const t = document.getElementById(domId); if (t) t.classList.add("selected"); } }

/* ---------- state classes (play + requirements) ---------- */
function applyState(){
  svg.classList.toggle("playing", S.playing);
  svg.classList.toggle("req-mode", S.req !== null);
  const visitedN = new Set(), visitedE = new Set();
  if (S.playing){ for (let i = 0; i <= S.idx; i++){ visitedN.add(STEPS[i].n); if (STEPS[i].e) visitedE.add(STEPS[i].e); } }
  const cur = S.playing && S.idx >= 0 ? STEPS[S.idx] : null;
  const reqSet = S.req !== null ? new Set(REQS[S.req].n) : null;
  for (const n of NODES){
    const g = $("n-"+n.id); if (!g) continue;
    g.classList.toggle("visited", visitedN.has(n.id));
    g.classList.toggle("active", !!cur && cur.n === n.id);
    g.classList.toggle("dim", S.playing && !PATH_NODES.includes(n.id) && n.id !== "regen");
    g.classList.toggle("ron", !!reqSet && reqSet.has(n.id));
    g.classList.toggle("rdim", !!reqSet && !reqSet.has(n.id));
  }
  for (const e of EDGES){
    const g = $("e-"+e.id); if (!g) continue;
    const ln = g.querySelector(".ln");
    const v = visitedE.has(e.id), a = !!cur && cur.e === e.id;
    g.classList.toggle("visited", v); g.classList.toggle("active", a);
    g.classList.toggle("dim", S.playing && !PATH_EDGES.includes(e.id));
    g.classList.toggle("rdim", !!reqSet && !(reqSet.has(e.from) && reqSet.has(e.to)));
    ln.setAttribute("marker-end", `url(#m-${v || a ? "active" : ln.dataset.kind})`);
  }
  // "skipped" tag on regenerate once the played request has passed the verifier
  const old = $("skip-tag"); if (old) old.remove();
  if (S.playing && S.idx >= 8){
    const n = byId.regen; const t = txt(svg, X(n.cx), n.cy + n.h/2 + 15, UI[S.lang].skipped, "skip-tag"); t.id = "skip-tag";
    $("n-regen").classList.add("dim");
  } else if ($("n-regen")) $("n-regen").classList.toggle("dim", S.playing);
}

/* ---------- player ---------- */
function stepText(i){
  const base = STEPS[i], o = S.q === "ar" ? (AR_STEPS[i] || {}) : {};
  return { c:(o.c || base.c)[S.lang], d:(o.d || base.d)[S.lang] };
}
/* Quoted runs («…», "…", “…”) are isolated in their own direction, so Arabic and English never reorder
   each other inside a line. Text is escaped first: captions are data, never markup. */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const QUOTED = /(«[^»]*»|"[^"]*"|“[^”]*”)/;
/* Direction of a line: its first strong letter outside quoted runs (else the first letter at all). */
function lineDir(s){
  const outside = s.split(QUOTED).filter((_, i) => i % 2 === 0).join(" ");
  const first = (outside.match(/[A-Za-z\u0600-\u06FF]/) || s.match(/[A-Za-z\u0600-\u06FF]/) || [""])[0];
  return hasArabic(first) ? "rtl" : "ltr";
}
/* In a right-to-left line, a trailing Latin run (after the last Arabic letter) is wrapped in LRI…PDI. */
const ltrTail = s => s.replace(/([A-Za-z][^\u0600-\u06FF]*?)([\s.,;:!?)]*)$/, (m, run, punct) => `\u2066${run}\u2069${punct}`);
function bidiHTML(s, dir){
  const parts = s.split(QUOTED), last = parts.length - 1;
  return parts.map((part, i) => {
    if (i % 2) return `<bdi dir="${hasArabic(part) ? "rtl" : "ltr"}">${esc(part)}</bdi>`;
    return esc(dir === "rtl" && i === last && hasArabic(s) && /[A-Za-z][^\u0600-\u06FF]*$/.test(part) ? ltrTail(part) : part);
  }).join("");
}
function renderPlayer(){
  const U = UI[S.lang], chip = $("stepchip");
  if (!S.playing){
    chip.textContent = U.idle; chip.classList.add("idle");
    const dd = S.lang === "ar" ? lineDir(U.idleData) : "ltr";
    $("caption").innerHTML = bidiHTML(U.idleCap, S.lang === "ar" ? "rtl" : "ltr"); $("capdata").innerHTML = bidiHTML(U.idleData, dd); $("capdata").setAttribute("dir", dd); $("capdata").classList.toggle("ar-mix", hasArabic(U.idleData)); $("capnote").textContent = "";
  } else {
    const t = stepText(S.idx);
    chip.classList.remove("idle"); chip.textContent = `${U.step} ${S.idx+1} ${U.of} ${STEPS.length}`;
    // a trace line reads left to right unless, in the Arabic interface, its first strong letter outside quotes is Arabic
    const dd = S.lang === "ar" ? lineDir(t.d) : "ltr";
    $("caption").innerHTML = bidiHTML(t.c, S.lang === "ar" ? "rtl" : "ltr"); $("capdata").innerHTML = bidiHTML(t.d, dd); $("capdata").setAttribute("dir", dd); $("capdata").classList.toggle("ar-mix", hasArabic(t.d));
    $("capnote").textContent = S.q === "ar" ? U.arNote : "";
  }
  $("b-prev").disabled = !S.playing || S.idx <= 0;
  $("b-next").disabled = !S.playing;
  $("b-pause").disabled = !S.playing;
  $("b-stop").disabled = !S.playing;
  $("t-pause").textContent = S.playing && S.idx >= STEPS.length - 1 && S.paused ? U.replay : (S.paused ? U.resume : U.pause);
}
function stopTimer(){ if (S.timer){ clearTimeout(S.timer); S.timer = null; } }
function cancelAnim(){ if (S.anim){ cancelAnimationFrame(S.anim); S.anim = null; } const tk = $("token"); if (tk) tk.remove(); }
function animateEdge(edgeId, done){
  cancelAnim();
  const g = $("e-"+edgeId); if (!g || reduceMotion){ done && done(); return; }
  const path = g.querySelector(".ln"), len = path.getTotalLength();
  const tok = el("circle", { r:8, class:"token", id:"token" }, svg);
  const t0 = performance.now(), dur = Math.min(1400, 500 + len * 2.2);
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    const p = path.getPointAtLength(e * len); tok.setAttribute("cx", p.x); tok.setAttribute("cy", p.y);
    if (k < 1) S.anim = requestAnimationFrame(tick); else { tok.remove(); S.anim = null; done && done(); }
  };
  S.anim = requestAnimationFrame(tick);
}
function goTo(i){
  stopTimer(); S.idx = Math.max(0, Math.min(STEPS.length - 1, i));
  const st = STEPS[S.idx];
  applyState(); renderPlayer();
  if (st.e) animateEdge(st.e, schedule); else schedule();
}
function schedule(){
  stopTimer();
  if (!S.playing || S.paused) return;
  if (S.idx >= STEPS.length - 1){ setPaused(true); return; }
  S.timer = setTimeout(() => goTo(S.idx + 1), 4600);
}
function setPaused(p){ S.paused = p; if (p) stopTimer(); renderPlayer(); }
function play(){
  if ($("panel").hidden === false && S.panel && S.panel.type !== "req") closePanel();
  S.req = null; $("b-req").setAttribute("aria-pressed", "false"); if (S.panel && S.panel.type === "req") closePanel();
  S.playing = true; S.paused = false; goTo(0);
}
function exitPlay(){ stopTimer(); cancelAnim(); S.playing = false; S.paused = false; S.idx = -1; applyState(); renderPlayer(); }

/* ---------- language ---------- */
function setLang(l){
  S.lang = l; const U = UI[l];
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  $("b-en").setAttribute("aria-pressed", l === "en"); $("b-ar").setAttribute("aria-pressed", l === "ar");
  $("t-brand").textContent = U.brand; $("t-title").textContent = U.title; $("t-play").textContent = U.play;
  $("b-qen").textContent = U.qen; $("b-qar").textContent = U.qar; $("b-req").textContent = U.req; $("b-leg").textContent = U.leg;
  $("g-q").setAttribute("aria-label", U.sampleQ);
  $("t-prev").textContent = U.prev; $("t-next").textContent = U.next; $("t-stop").textContent = U.stop;
  $("a-prev").textContent = l === "ar" ? "▶" : "◀"; $("a-next").textContent = l === "ar" ? "◀" : "▶";
  $("t-attr").textContent = U.attr; $("t-src").textContent = U.src; $("p-close").setAttribute("aria-label", U.close);
  cancelAnim(); draw(); renderPlayer();
  if (S.panel){ const p = S.panel; if (p.type === "node") openNode(p.id, { keepReq:true }); else if (p.type === "edge") openEdge(p.id); else openReqs(true); }
}

/* ---------- wiring ---------- */
$("b-play").addEventListener("click", play);
$("b-pause").addEventListener("click", () => { if (!S.playing) return; if (S.paused && S.idx >= STEPS.length - 1){ goTo(0); S.paused = false; renderPlayer(); schedule(); return; } setPaused(!S.paused); if (!S.paused) schedule(); });
$("b-next").addEventListener("click", () => { if (!S.playing) return; if (S.idx >= STEPS.length - 1){ setPaused(true); return; } goTo(S.idx + 1); });
$("b-prev").addEventListener("click", () => { if (S.playing) goTo(S.idx - 1); });
$("b-stop").addEventListener("click", exitPlay);
$("b-qen").addEventListener("click", () => { S.q = "en"; $("b-qen").setAttribute("aria-pressed","true"); $("b-qar").setAttribute("aria-pressed","false"); renderPlayer(); });
$("b-qar").addEventListener("click", () => { S.q = "ar"; $("b-qar").setAttribute("aria-pressed","true"); $("b-qen").setAttribute("aria-pressed","false"); renderPlayer(); });
$("b-req").addEventListener("click", () => { if (S.panel && S.panel.type === "req") closePanel(); else { S.lastFocus = $("b-req"); if (S.playing) exitPlay(); openReqs(); } });
$("b-leg").addEventListener("click", () => { S.legend = !S.legend; $("b-leg").setAttribute("aria-pressed", S.legend); cancelAnim(); draw(); });
$("b-en").addEventListener("click", () => setLang("en"));
$("b-ar").addEventListener("click", () => setLang("ar"));
$("p-close").addEventListener("click", closePanel);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("panel").hidden){ ev.preventDefault(); closePanel(); } });
window.addEventListener("resize", () => {});
setLang("en");
</script>
</body>
</html>
